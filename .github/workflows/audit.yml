name: Audit outputs
on:
  push:
    branches: [audit-outputs]
permissions:
  contents: read
jobs:
  outputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run src/content/exercises/outputs.itest.ts --reporter=verbose
