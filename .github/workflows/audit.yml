name: Audit outputs
on:
  push:
    branches: [audit-outputs]
permissions:
  contents: write
jobs:
  outputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run src/content/exercises/outputs.itest.ts
      - run: |
          git config user.name "Peter Slijkhuis"
          git config user.email peter@slijkhuis.one
          git add -f lesson-outputs.txt
          git commit -m "Lesson outputs"
          git push
